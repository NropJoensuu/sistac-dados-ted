name: Coleta Convênios (SICONV / Transferegov)

on:
  schedule:
    # 15 minutos depois da coleta do TED (coleta.yml), com a mesma reserva.
    # A fonte é atualizada uma vez por dia (data em dados/convenios_data_carga.txt).
    - cron: '22 8 * * *'   # 05:22 em Brasília
    - cron: '52 9 * * *'   # 06:52 em Brasília (reserva)
    # O fluxo do SISTAC no Power Automate deve rodar depois disso (07:45).
  workflow_dispatch:

permissions:
  contents: write

# evita que as duas coletas façam push ao mesmo tempo
concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coleta
        run: python3 scripts/coleta_convenios.py
      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados: convênios $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
