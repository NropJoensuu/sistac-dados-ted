name: Coleta Convênios (SICONV / Transferegov)

on:
  schedule:
    # A fonte (Transferegov) é atualizada por volta de 08:14 em Brasília.
    # Coleta às 09:07; o fluxo F2 do SISTAC roda às 09:22. Reserva às 09:47:
    # se a das 09:07 atrasar ou falhar, os dados entram no fluxo do dia seguinte.
    - cron: '7 12 * * *'   # 09:07 em Brasília
    - cron: '47 12 * * *'  # 09:47 em Brasília (reserva)
  workflow_dispatch:

permissions:
  contents: write

# evita que as duas coletas façam push ao mesmo tempo
concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coleta
        run: python3 scripts/coleta_convenios.py
      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados: convênios $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
