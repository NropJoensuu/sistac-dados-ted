name: Coleta TED (API TransfereGov)

on:
  schedule:
    # O agendamento do GitHub atrasa ou pula execuções em horários cheios
    # (a das 08:30 UTC de 2026-10-19 não rodou). Por isso: minutos "quebrados"
    # e uma segunda execução de reserva. A segunda só gera commit se algo mudou.
    - cron: '7 8 * * *'    # 05:07 em Brasília
    - cron: '37 9 * * *'   # 06:37 em Brasília (reserva)
    # O fluxo do SISTAC no Power Automate deve rodar depois disso (07:30).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coleta
        run: python3 scripts/coleta_ted.py
      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados: coleta $(date -u +%Y-%m-%d)"
            git push
          fi
